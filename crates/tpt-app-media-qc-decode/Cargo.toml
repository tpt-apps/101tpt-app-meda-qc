[package]
name = "tpt-app-media-qc-decode"
description = "Kinetix-backed video and Cadence-backed audio decode inspection for TPT Media QC (spec §10, §8.2–§8.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["media", "decode", "av1", "vp9", "audio"]
categories = ["multimedia", "multimedia::video"]

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tpt-app-media-qc-core = { path = "../tpt-app-media-qc-core" }
tpt-app-media-qc-model = { path = "../tpt-app-media-qc-model" }
tpt-app-media-qc-pipeline = { path = "../tpt-app-media-qc-pipeline" }
tpt-av-cadence-core.workspace = true
tpt-av-cadence-wav.workspace = true
tpt-av-cadence-aiff.workspace = true
tpt-av-cadence-flac.workspace = true
tpt-kinetix-core.workspace = true
tpt-kinetix-demux.workspace = true
tpt-kinetix-av1.workspace = true
tpt-kinetix-vp9.workspace = true
tpt-av-voice-utils = { workspace = true, optional = true }
tpt-av-voice-diarize = { workspace = true, optional = true }

[features]
# Speech detection and speaker clustering (spec 8.8). Off by default: voice
# analysis is optional and must never be required for basic QC.
voice = ["dep:tpt-av-voice-utils", "dep:tpt-av-voice-diarize"]

[dev-dependencies]
tempfile.workspace = true
