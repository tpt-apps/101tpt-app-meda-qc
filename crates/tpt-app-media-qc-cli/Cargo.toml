[package]
name = "tpt-app-media-qc-cli"
description = "TPT Media QC command line interface with a stable exit-code contract (spec §16)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "tpt-media-qc"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
tpt-app-media-qc-core = { path = "../tpt-app-media-qc-core" }
tpt-app-media-qc-model = { path = "../tpt-app-media-qc-model" }
tpt-app-media-qc-profile = { path = "../tpt-app-media-qc-profile" }
tpt-app-media-qc-rules = { path = "../tpt-app-media-qc-rules" }
tpt-app-media-qc-pipeline = { path = "../tpt-app-media-qc-pipeline" }
tpt-app-media-qc-report = { path = "../tpt-app-media-qc-report" }
