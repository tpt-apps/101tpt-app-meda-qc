[package]
name = "tpt-app-media-qc-store"
description = "SQLite persistence for local application state: projects, assets, fingerprints, jobs, profiles, results, findings, report metadata and preferences (spec 18)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
tpt-app-media-qc-core = { path = "../tpt-app-media-qc-core", features = ["sqlite"] }
tpt-app-media-qc-model = { path = "../tpt-app-media-qc-model" }
tpt-app-media-qc-profile = { path = "../tpt-app-media-qc-profile" }
tpt-app-media-qc-pipeline = { path = "../tpt-app-media-qc-pipeline" }

[dev-dependencies]
tempfile.workspace = true