[workspace]
resolver = "2"
members = [
    "crates/tpt-app-media-qc-core",
    "crates/tpt-app-media-qc-model",
    "crates/tpt-app-media-qc-rules",
    "crates/tpt-app-media-qc-pipeline",
    "crates/tpt-app-media-qc-profile",
    "crates/tpt-app-media-qc-report",
    "crates/tpt-app-media-qc-store",
    "crates/tpt-app-media-qc-decode",
    "crates/tpt-app-media-qc-plugin-sdk",
    "crates/tpt-app-media-qc-plugin",
    "crates/tpt-app-media-qc-cli",
    "crates/tpt-app-media-qc-tauri",
    "crates/tpt-app-media-qc-test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-app-media-qc"
description = "Offline-first professional media quality-control and validation application."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
lopdf = "0.36"
notify = "7"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-opener = "2.5.5"

# TPT foundations. The demux, decoder and mux crates are pinned to the
# same Kinetix revision; their shared core must come from that same source
# (using the registry copy would create incompatible packet/frame types).
tpt-kinetix-core = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "1a8623ce48b50ca31393b230a884d255a4cba1c3" }
tpt-kinetix-demux = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "1a8623ce48b50ca31393b230a884d255a4cba1c3" }
# Royalty-free video decoders only: H.264 is deliberately not used (AVC patent
# pools license decoders as well as encoders).
tpt-kinetix-av1 = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "1a8623ce48b50ca31393b230a884d255a4cba1c3" }
tpt-kinetix-vp9 = { git = "https://github.com/tpt-solutions/tpt-kinetix", rev = "1a8623ce48b50ca31393b230a884d255a4cba1c3" }
# Pinned Cadence revision: stable standalone WAV, AIFF/AIFC and FLAC readers.
# Their shared core must come from the same source (using another revision can
# create incompatible Decoder/StreamInfo types).
tpt-av-cadence-core = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "52a64617e7cc4dc89a5c4d514dea93ef7b0a913f" }
tpt-av-cadence-wav = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "52a64617e7cc4dc89a5c4d514dea93ef7b0a913f" }
tpt-av-cadence-aiff = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "52a64617e7cc4dc89a5c4d514dea93ef7b0a913f" }
tpt-av-cadence-flac = { git = "https://github.com/tpt-solutions/tpt-cadence", rev = "52a64617e7cc4dc89a5c4d514dea93ef7b0a913f" }
# Optional voice analysis (spec 8.8): weight-free VAD and speaker clustering.
# Used only by the decode crate's `voice` feature; basic QC never needs it.
tpt-av-voice-utils = { git = "https://github.com/tpt-solutions/tpt-voice", rev = "05ffff3b2bbda5e56784c430b54beab2d8a33562" }
tpt-av-voice-diarize = { git = "https://github.com/tpt-solutions/tpt-voice", rev = "05ffff3b2bbda5e56784c430b54beab2d8a33562" }
# Further integration points once available/published (spec §8.4–§8.8):
# tpt-dsp = { path = "../../dsp" }
# tpt-visual = { path = "../../visual" }
# tpt-voice = { path = "../../voice" }
# tpt-av-asset = { path = "../../av-asset" }
# tpt-av-test = { path = "../../av-test" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
all = "warn"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1