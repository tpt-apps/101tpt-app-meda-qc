# BT.1700/BT.1702-flavoured SDTV broadcast delivery profile.
#
# Models a 625-line (576i) standard-definition digital broadcast delivery:
# interlaced scanning with a signalled field order, 4:3 (or anamorphic 16:9)
# aspect, 25 Hz, and EBU R128 loudness. The scanning/field-order checks are
# the reason this profile exists: interlaced delivery chains cannot safely
# process a file whose field order is not signalled.
#
# NOTE (spec §25): this profile encodes commonly used delivery thresholds; it
# does NOT claim formal compliance with ITU-R BT.1700/BT.1702 until validated
# against reference material.
name: "broadcast-sd-576i"
version: 1
description: "SD broadcast delivery (576i25, interlaced, top field first) with EBU R128 audio."

rules:
  container:
    readable: error
    container_validity: error
    malformed_metadata: warning
    timecode_present: warning
    timestamp_continuity:
      max_gap_ms: 100
    stream_presence:
      min_video: 1
      min_audio: 1
      max_streams: 32

  video:
    resolution:
      expected: "720x576"
      severity: error
    frame_rate:
      expected: "25/1"
      tolerance: 0.001
      severity: error
    aspect_ratio:
      expected: "4/3"
      tolerance: 0.01
      severity: warning
    scan_format:
      scan: interlaced
      field_order: top_field_first
      severity: error
    black_frames:
      max_duration_ms: 500
      severity: warning
    freeze_frames:
      max_duration_ms: 500
      severity: error

  audio:
    silence:
      max_duration_ms: 2000
      severity: warning
    clipping:
      max_events: 0
      severity: error
    loudness:
      standard: ebu-r128
      target_lufs: -23
      tolerance_lu: 0.5
      severity: error
    true_peak:
      max_db: -2
      severity: error
    phase:
      min_correlation: 0.3
      severity: warning
